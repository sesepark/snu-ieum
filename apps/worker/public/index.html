<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서울대 이음 · 데이터 검수</title></head><body><main><h1>서울대 이음 · 데이터 검수</h1><p>localhost 전용입니다. 원문·관계·개인정보를 검토한 사람이 승인합니다.</p><form id="access"><label>운영 토큰 <input id="token" type="password" autocomplete="off" required></label><button>검수 대기 불러오기</button></form><label>검수자 <input id="actor" required></label><label>사유 <input id="reason" required></label><p id="status" role="status"></p><section id="drafts"></section><section><h2>배치 반영·롤백</h2><p>반영 전 내보낸 JSON에서 전체 출처·개인정보·학과별 수량을 검토하세요.</p><label>승인된 staging ID <input id="staging"></label><label>배치 버전 <input id="version"></label><label><input id="reviewed" type="checkbox">공개 데이터와 승인 기록을 확인했습니다</label><button id="publish">승인 배치 반영</button><button id="rollback">지정 버전으로 롤백</button></section><pre id="summary"></pre></main><script src="/ops/admin.js" defer></script></body></html>
