<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
 <title id="title">서울대 이음</title>
 <desc id="desc">관심 분야에서 연구실 교수 장비 공간을 찾고 실제 위치와 공식 출처까지 확인하는 연구자원 지도</desc>
 <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d6dce6" stroke-opacity=".28"/></pattern></defs>
 <rect width="1280" height="330" rx="24" fill="#ffffff"/>
 <rect width="1280" height="330" rx="24" fill="url(#grid)"/>
 <g font-family="Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
  <rect x="48" y="36" width="340" height="32" rx="16" fill="#f4f7ff"/>
  <text x="66" y="58" font-size="15" font-weight="700" fill="#2855f3">SNU IEUM · RESEARCH RESOURCE MAP</text>
