  <text x="51" y="202" font-size="28" font-weight="700" letter-spacing="-1" fill="#39404d">관심 분야에서 연구자원까지</text>
  <text x="51" y="237" font-size="20" fill="#4c5360">실제 캠퍼스 위에서 찾고, 위치와 공식 근거로 확인합니다.</text>
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#1b4bc4">
   <rect x="51" y="267" width="92" height="30" rx="15" fill="#e8efff"/><text x="97" y="288">연구실</text>
