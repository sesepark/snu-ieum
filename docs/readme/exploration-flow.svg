<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360"><rect width="1280" height="360" rx="28" fill="#f4f7ff"/><g font-family="Pretendard, Apple SD Gothic Neo, sans-serif"><text x="44" y="56" font-size="28" font-weight="700" fill="#142448">어느 학과부터 찾아야 할지 몰라도, 관심 분야로 시작하세요</text><text x="44" y="91" font-size="18" fill="#53627b">공대 12개 학과와 공용시설 · 공식 출처가 연결된 연구자원 탐색</text><rect x="44" y="125" width="370" height="155" rx="18" fill="white"/><text x="68" y="163" font-size="18" fill="#2855f3">01</text><text x="68" y="202" font-size="28" font-weight="700" fill="#142448">관심 분야로 찾기</text><text x="68" y="240" font-size="19" fill="#53627b">연구실·교수·장비·공간 검색</text><rect x="455" y="125" width="370" height="155" rx="18" fill="white"/><text x="479" y="163" font-size="18" fill="#2855f3">02</text><text x="479" y="202" font-size="28" font-weight="700" fill="#142448">실제 장소 확인하기</text><text x="479" y="240" font-size="19" fill="#53627b">건물·호실과 공식 설치 관계</text><rect x="866" y="125" width="370" height="155" rx="18" fill="white"/><text x="890" y="163" font-size="18" fill="#2855f3">03</text><text x="890" y="202" font-size="28" font-weight="700" fill="#142448">공식 안내 열기</text><text x="890" y="240" font-size="19" fill="#53627b">정보의 근거와 최신 이용 안내</text><text x="44" y="324" font-size="18" fill="#53627b">832개 자원 후보 · 장비 67개의 설치 장소 연결 · 사람 승인 전 시제품</text></g></svg>